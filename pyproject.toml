[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "formalevolve"
version = "0.1.0"
description = "Neuro-symbolic evolutionary search for diverse and prover-effective Lean autoformalization"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "third_party/licenses/*"]
authors = [
    {name = "Haijian Lu"},
    {name = "Wei Wang"},
    {name = "Jing Liu"},
]
keywords = ["autoformalization", "Lean 4", "evolutionary search", "theorem proving"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "openai",
    "numpy",
    "pandas",
    "anthropic",
    "requests",
    "httpx",
    "aiohttp",
    "boto3",
    "pydantic",
    "backoff",
    "python-dotenv",
    "instructor",
    "python-Levenshtein",
    "radon",
    "unidiff",
    "dill",
    "hydra-core==1.3.2",
    "matplotlib",
    "networkx",
    "seaborn",
    "moviepy",
    "scikit-learn",
    "adjustText",
    "markdown",
    "aiofiles",
    "google-generativeai",
    "lean-interact>=0.10.5",
]
[project.urls]
Homepage = "https://github.com/cnfjlhj/formalevolve"
Paper = "https://arxiv.org/abs/2603.19828"
Issues = "https://github.com/cnfjlhj/formalevolve/issues"


[tool.setuptools]
script-files = ["shinka/shinka_launch", "shinka/shinka_visualize"]

[tool.setuptools.packages.find]
include = ["shinka", "shinka.*", "autoformalization", "autoformalization.*"]

[tool.setuptools.package-data]
"*" = ["*"]

[dependency-groups]
dev = [
    "pytest>=6.0",
    "black",
    "isort",
    "flake8",
]
