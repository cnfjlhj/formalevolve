# Optimized configuration for low-RPM rate limits.
evo_config:
  _target_: shinka.core.EvolutionConfig
  patch_types:
    - "diff"
    - "full"
  patch_type_probs:
    - 0.7
    - 0.3
  num_generations: 10
  max_parallel_jobs: 1  # limit concurrency
  max_patch_resamples: 2
  max_patch_attempts: 5
  llm_models:
    - "gpt-4o-mini"  # use a lightweight model
  llm_dynamic_selection: null
  llm_kwargs:
    temperatures:
      - 0.0
      - 0.3
      - 0.7
    max_tokens: 8192
  meta_rec_interval: null  # disable meta recommendations to reduce API calls
  embedding_model: null  # disable embeddings to reduce API calls
  results_dir: ${output_dir}
