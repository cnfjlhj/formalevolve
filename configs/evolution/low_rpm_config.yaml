# 针对低RPM限制的优化配置
evo_config:
  _target_: shinka.core.EvolutionConfig
  patch_types:
    - "diff"
    - "full"
  patch_type_probs:
    - 0.7
    - 0.3
  num_generations: 10
  max_parallel_jobs: 1  # 限制并行任务数
  max_patch_resamples: 2
  max_patch_attempts: 5
  llm_models:
    - "gpt-4o-mini"  # 使用轻量级GPT模型
  llm_dynamic_selection: null
  llm_kwargs:
    temperatures:
      - 0.0
      - 0.3
      - 0.7
    max_tokens: 8192
  meta_rec_interval: null  # 关闭元推荐以减少API调用
  embedding_model: null  # 关闭embedding以减少API调用
  results_dir: ${output_dir}